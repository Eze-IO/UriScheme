name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # The library and its tests use the Windows registry
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UriScheme.sln

      - name: Build
        run: dotnet build UriScheme.sln -c Release --no-restore

      - name: Test
        run: dotnet test UriScheme.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/UriScheme/UriScheme.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
