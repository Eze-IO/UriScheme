name: publish

# Publishes to NuGet.org when a version tag such as v1.1.0 is pushed.
#
# Uses NuGet.org Trusted Publishing (OIDC): no long-lived API key is stored.
# One-time setup on nuget.org -> your username -> Trusted Publishing, add a policy:
#   Repository Owner: Eze-IO   Repository: UriScheme   Workflow File: publish.yml
# and add a repository secret NUGET_USER holding your nuget.org username (profile
# name, not your email).
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    # The tests use the Windows registry
    runs-on: windows-latest
    permissions:
      id-token: write   # allow GitHub to issue the OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build UriScheme.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test UriScheme.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/UriScheme/UriScheme.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: bash
        # Let bash expand the path, dotnet nuget push doesn't match "artifacts/*.nupkg" on Windows
        # No --skip-duplicate: NuGet answers 409 Conflict for other problems too (such as an ID that
        # isn't available), and that option hides the message and marks the run as passed
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
