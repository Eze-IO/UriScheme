name: publish

# Publishes to NuGet.org when a version tag such as v1.1.0 is pushed.
# Needs a NUGET_API_KEY repository secret with push rights for Eze.IO.UriScheme.
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    # The tests use the Windows registry
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build UriScheme.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test UriScheme.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/UriScheme/UriScheme.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Push to NuGet.org
        shell: bash
        # Let bash expand the path, dotnet nuget push doesn't match "artifacts/*.nupkg" on Windows
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
